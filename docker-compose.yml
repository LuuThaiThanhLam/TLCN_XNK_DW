x-airflow-common: &airflow-common
  build:
    context: ./docker/airflow
    dockerfile: Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-dwh_admin}:${POSTGRES_PASSWORD:-dwh_secret_change_me}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    DBT_PROFILES_DIR: /opt/airflow/dbt_project
    POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
    POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    POSTGRES_DB: ${POSTGRES_DB:-tlcn_dwh}
    POSTGRES_USER: ${POSTGRES_USER:-dwh_admin}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dwh_secret_change_me}
    MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_change_me}
    MINIO_BUCKET: ${MINIO_BUCKET:-tlcn-raw}
    CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
    CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
    CLICKHOUSE_DB: ${CLICKHOUSE_DB:-olap_xnk}
    CLICKHOUSE_USER: ${CLICKHOUSE_USER:-olap_user}
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-olap_secret_change_me}
    INGESTION_MODE: ${INGESTION_MODE:-seed}
    COMTRADE_PRIMARY_KEY: ${COMTRADE_PRIMARY_KEY:-your_key_here}
    SEED_DIR: /opt/airflow/data/seed_staging
    RUNTIME_STAGING_DIR: /opt/airflow/data/runtime_staging
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./ingestion:/opt/airflow/ingestion
    - ./dbt_project:/opt/airflow/dbt_project
    - ./sql:/opt/airflow/sql
    - ./scripts:/opt/airflow/scripts
    - ./data/seed_staging:/opt/airflow/data/seed_staging:ro
    - ./data/runtime_staging:/opt/airflow/data/runtime_staging
    - ./results:/opt/airflow/results
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy
    clickhouse:
      condition: service_healthy
  networks:
    - dwh_net

services:
  postgres:
    image: postgres:16-alpine
    container_name: tlcn_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tlcn_dwh}
      POSTGRES_USER: ${POSTGRES_USER:-dwh_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dwh_secret_change_me}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init_databases.sql:/docker-entrypoint-initdb.d/01_init_databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dwh_admin} -d ${POSTGRES_DB:-tlcn_dwh}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    restart: unless-stopped
    networks:
      - dwh_net

  minio:
    image: bitnamilegacy/minio:latest
    container_name: tlcn_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_change_me}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET:-tlcn-raw}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - dwh_net

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: tlcn_clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-olap_xnk}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-olap_user}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-olap_secret_change_me}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9009:9000"
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./docker/clickhouse/init_olap.sql:/docker-entrypoint-initdb.d/01_init_olap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    restart: unless-stopped
    networks:
      - dwh_net

  airflow-init:
    <<: *airflow-common
    container_name: tlcn_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username $${AIRFLOW_ADMIN_USER:-admin} \
          --password $${AIRFLOW_ADMIN_PASSWORD:-admin} \
          --firstname DWH \
          --lastname Admin \
          --role Admin \
          --email admin@tlcn.local || true
    environment:
      <<: *airflow-common-env
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: tlcn_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    mem_limit: 1g
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: tlcn_airflow_scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    mem_limit: 1g
    restart: unless-stopped

  metabase:
    image: metabase/metabase:v0.55.12.2
    container_name: tlcn_metabase
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER:-dwh_admin}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-dwh_secret_change_me}
      MB_DB_HOST: postgres
      JAVA_OPTS: "-Xmx1024m"
    ports:
      - "${MB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1500m
    restart: unless-stopped
    networks:
      - dwh_net

volumes:
  pg_data:
  minio_data:
  ch_data:

networks:
  dwh_net:
    driver: bridge
